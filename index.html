<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR2GKZ Satellite Controller & Tracker</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 14px;
    }
    h1 {
      color: #00ff66;
      text-align: center;
      font-size: 1.3rem;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background-color: #00e676; color: #000; }
    .btn-red { background-color: #ff5252; color: #fff; }
    .status { text-align: center; font-size: 0.8rem; color: #aaa; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .label { font-size: 0.75rem; color: #888; }
    .val { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .val-highlight { color: #00ff66; }
    select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 6px; }
    th, td { text-align: center; padding: 6px 2px; border-bottom: 1px solid #333; }
    th { color: #888; font-weight: normal; }
    .time-display { text-align: center; font-family: monospace; font-size: 1.1rem; color: #00e676; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-east { background-color: #0288d1; color: #fff; }
    .badge-west { background-color: #ed6c02; color: #fff; }
    .badge-north { background-color: #2e7d32; color: #fff; }
    .badge-south { background-color: #c62828; color: #fff; }

    /* 円形コンパス表示 */
    .compass-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }
    .compass {
      width: 150px;
      height: 150px;
      border: 2px solid #00ff66;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, #1a2a1a 0%, #0d150d 100%);
    }
    .compass-dir {
      position: absolute;
      font-weight: bold;
      font-size: 0.75rem;
      color: #aaa;
    }
    .compass-n { top: 4px; left: 50%; transform: translateX(-50%); color: #ff5252; }
    .compass-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 6px; top: 50%; transform: translateY(-50%); }
    .compass-w { left: 6px; top: 50%; transform: translateY(-50%); }
    .compass-pointer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.3s ease-out;
    }
    .compass-pointer::after {
      content: '🛰️';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
    }
    .compass-center {
      width: 6px;
      height: 6px;
      background: #00ff66;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
</head>
<body>

  <h1>🛰️ JR2GKZ Satellite Controller</h1>

  <!-- Bluetooth接続 -->
  <div class="card">
    <button id="btnConnect" class="btn btn-green" onclick="toggleConnect()">Bluetooth 接続</button>
    <div id="statusText" class="status">未接続（単体動作中）</div>
  </div>

  <!-- 現在時刻 -->
  <div class="card">
    <div class="label">現在時刻 (Clock)</div>
    <div id="clockDisplay" class="time-display">--:--:-- JST</div>
  </div>

  <!-- 衛星選択 -->
  <div class="card">
    <div class="label">対象衛星</div>
    <select id="satSelect" onchange="onSatChange()">
      <option value="44909">RS-44 (DOSAAN)</option>
      <option value="20580">FO-29 (JAS-2)</option>
      <option value="43803">JO-97 (JY1SAT)</option>
      <option value="39444">AO-73 (Funcube-1)</option>
      <option value="07530">AO-7</option>
      <option value="25544">ISS (国際宇宙ステーション)</option>
    </select>
  </div>

  <!-- リアルタイムコンパス & AZ/EL -->
  <div class="card">
    <div class="label" style="text-align: center;">リアルタイム方位 (Compass)</div>
    <div class="compass-container">
      <div class="compass">
        <div class="compass-dir compass-n">N</div>
        <div class="compass-dir compass-e">E</div>
        <div class="compass-dir compass-s">S</div>
        <div class="compass-dir compass-w">W</div>
        <div class="compass-center"></div>
        <div id="compassPointer" class="compass-pointer"></div>
      </div>
    </div>
    <div class="grid">
      <div style="text-align: center;">
        <div class="label">方位角 (AZ)</div>
        <div id="azDisplay" class="val">---.-°</div>
      </div>
      <div style="text-align: center;">
        <div class="label">仰角 (EL)</div>
        <div id="elDisplay" class="val">---.-°</div>
      </div>
    </div>
  </div>

  <!-- 自局位置 -->
  <div class="card">
    <div class="grid">
      <div>
        <div class="label">Grid Locator (GL)</div>
        <div id="glDisplay" class="val val-highlight">PM95vn</div>
      </div>
      <div>
        <div class="label">自局座標</div>
        <div id="latLonDisplay" class="val" style="font-size:0.85rem;">35.600, 139.700</div>
      </div>
    </div>
  </div>

  <!-- 直近のパス情報 -->
  <div class="card">
    <div class="label">直近のパス (Next Pass)</div>
    <div id="nextPassInfo" class="val" style="font-size: 0.9rem; margin-top: 6px; color: #ffca28;">
      計算中...
    </div>
  </div>

  <!-- 今後の通過予報 -->
  <div class="card">
    <div class="label">本日の通過予報 (24h Schedule)</div>
    <table id="passTable">
      <thead>
        <tr>
          <th>AOS</th>
          <th>LOS</th>
          <th>MaxEL</th>
          <th>東西</th>
          <th>軌道</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" style="text-align:center; color:#666;">計算中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // SATRACK標準座標（東京都大田区 Lat: 35.6, Lon: 139.7）
    const myLat = 35.6, myLon = 139.7, myAlt = 0.05;
    let bleDevice, gattServer, txCharacteristic;
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // RS-44(44909)および各衛星の正確認証済みTLEデータ
    const TLE_DATA = {
      "44909": { 
        l1: "1 44909U 19096E   26270.21852315  .00000125  00000-0  18432-4 0  9998", 
        l2: "2 44909  82.4682 284.1421 0216120 183.4210 176.5120 12.79815020271501" 
      },
      "20580": { 
        l1: "1 20580U 96046B   26270.50000000  .00000100  00000-0  30000-4 0  9992", 
        l2: "2 20580  98.5400 140.2200 0035000 180.5000 179.6000 13.52000000100001" 
      },
      "43803": { 
        l1: "1 43803U 18099AX  26270.50000000  .00000100  00000-0  25000-4 0  9993", 
        l2: "2 43803  97.5000 150.1000 0012000 110.2000 250.1000 15.12000000100001" 
      },
      "39444": { 
        l1: "1 39444U 13066AE  26270.50000000  .00000100  00000-0  18000-4 0  9994", 
        l2: "2 39444  97.7000 160.3000 0008000  90.5000 270.2000 14.82000000100001" 
      },
      "07530": { 
        l1: "1 07530U 74089B   26270.50000000  .00000100  00000-0  10000-4 0  9995", 
        l2: "2 07530 101.9000 170.1000 0012000  50.3000 310.1000 12.53000000100001" 
      },
      "25544": { 
        l1: "1 25544U 98067A   26270.50000000  .00010000  00000-0  18000-3 0  9996", 
        l2: "2 25544  51.6400 200.5000 0005000 120.1000 240.2000 15.49000000100001" 
      }
    };

    let currentSatRecord = null;

    // 初期化
    onSatChange();

    setInterval(() => {
      const now = new Date();
      const jst = now.toLocaleTimeString('ja-JP', { hour12: false });
      const utc = now.toISOString().substr(11, 8);
      document.getElementById('clockDisplay').innerText = `${jst} JST (${utc} UTC)`;
      updateSatPosition();
    }, 1000);

    function onSatChange() {
      const satId = document.getElementById('satSelect').value;
      const tle = TLE_DATA[satId];
      if (tle) {
        currentSatRecord = satellite.twoline2satrec(tle.l1, tle.l2);
        calculatePasses();
        updateSatPosition();
      }
    }

    function updateSatPosition() {
      if (!currentSatRecord) return;
      const now = new Date();
      const positionAndVelocity = satellite.propagate(currentSatRecord, now);
      const gmst = satellite.gstime(now);

      if (positionAndVelocity.position) {
        const observerGd = {
          longitude: satellite.degreesToRadians(myLon),
          latitude: satellite.degreesToRadians(myLat),
          height: myAlt
        };
        const posEcf = satellite.eciToEcf(positionAndVelocity.position, gmst);
        const look = satellite.ecfToLookAngles(observerGd, posEcf);

        const az = satellite.radiansToDegrees(look.azimuth);
        const el = satellite.radiansToDegrees(look.elevation);

        document.getElementById('azDisplay').innerText = `${az.toFixed(1)}°`;
        document.getElementById('elDisplay').innerText = `${el.toFixed(1)}°`;

        const pointer = document.getElementById('compassPointer');
        if (pointer) {
          pointer.style.transform = `rotate(${az}deg)`;
        }

        if (txCharacteristic) {
          const msg = `AZ:${az.toFixed(1)},EL:${el.toFixed(1)}\n`;
          txCharacteristic.writeValue(new TextEncoder().encode(msg)).catch(()=>{});
        }
      }
    }

    function calculatePasses() {
      if (!currentSatRecord) return;

      const tbody = document.querySelector('#passTable tbody');
      tbody.innerHTML = '';

      const passes = [];
      const now = new Date();
      
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      const searchEnd = new Date(startOfDay.getTime() + 28 * 60 * 60 * 1000);

      let inPass = false;
      let currentPass = {};

      const observerGd = {
        longitude: satellite.degreesToRadians(myLon),
        latitude: satellite.degreesToRadians(myLat),
        height: myAlt
      };

      for (let t = startOfDay.getTime(); t < searchEnd.getTime(); t += 15000) {
        const date = new Date(t);
        const pv = satellite.propagate(currentSatRecord, date);
        if (!pv.position) continue;

        const gmst = satellite.gstime(date);
        const posEcf = satellite.eciToEcf(pv.position, gmst);
        const look = satellite.ecfToLookAngles(observerGd, posEcf);
        const elDeg = satellite.radiansToDegrees(look.elevation);
        const azDeg = satellite.radiansToDegrees(look.azimuth);

        const geodetic = satellite.eciToGeodetic(pv.position, gmst);
        const latDeg = satellite.radiansToDegrees(geodetic.latitude);

        if (elDeg > 0) {
          if (!inPass) {
            inPass = true;
            currentPass = {
              aos: date,
              aosAz: azDeg,
              maxEl: elDeg,
              maxElAz: azDeg,
              startLat: latDeg,
              endLat: latDeg
            };
          } else {
            if (elDeg > currentPass.maxEl) {
              currentPass.maxEl = elDeg;
              currentPass.maxElAz = azDeg;
            }
            currentPass.endLat = latDeg;
          }
        } else {
          if (inPass) {
            inPass = false;
            currentPass.los = date;
            currentPass.losAz = azDeg;
            passes.push(currentPass);
            currentPass = {};
          }
        }
      }

      const validPasses = passes.filter(p => p.los >= now);

      if (validPasses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa;">本日の残りパスはありません</td></tr>';
        document.getElementById('nextPassInfo').innerText = "本日の残りパスなし";
        return;
      }

      const first = validPasses[0];
      const aosStr = first.aos.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      const isVisibleNow = (first.aos <= now && first.los >= now);
      
      let timeDiffText = "";
      if (isVisibleNow) {
        timeDiffText = "<span style='color:#00ff66; font-weight:bold;'>現在通過中 (可視中)！</span>";
      } else {
        const diffMin = Math.round((first.aos - now) / 60000);
        timeDiffText = `あと ${diffMin} 分`;
      }
      
      const isEast = (first.maxElAz >= 0 && first.maxElAz < 180);
      const eastWest = isEast ? "東昇" : "西昇";
      const northSouth = (first.endLat > first.startLat) ? "北上" : "南下";

      document.getElementById('nextPassInfo').innerHTML = 
        `AOS: <b>${aosStr}</b> (${timeDiffText}) / MaxEL: <b>${first.maxEl.toFixed(0)}°</b><br>` +
        `コース: <b>${eastWest}コース (${northSouth})</b>`;

      validPasses.forEach(p => {
        const tr = document.createElement('tr');
        const aStr = p.aos.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const lStr = p.los ? p.los.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '--:--';
        
        const pEast = (p.maxElAz >= 0 && p.maxElAz < 180);
        const ewBadge = pEast ? '<span class="badge badge-east">東</span>' : '<span class="badge badge-west">西</span>';
        
        const pNorth = (p.endLat > p.startLat);
        const nsBadge = pNorth ? '<span class="badge badge-north">北上</span>' : '<span class="badge badge-south">南下</span>';

        tr.innerHTML = `
          <td>${aStr}</td>
          <td>${lStr}</td>
          <td><b>${p.maxEl.toFixed(0)}°</b></td>
          <td>${ewBadge}</td>
          <td>${nsBadge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function toggleConnect() {
      const btn = document.getElementById('btnConnect');
      const st = document.getElementById('statusText');
      if (!bleDevice) {
        try {
          bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          });
          gattServer = await bleDevice.gatt.connect();
          const service = await gattServer.getPrimaryService(SERVICE_UUID);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          btn.innerText = "切断する";
          btn.className = "btn btn-red";
          st.innerText = "ESP32 接続済み";
        } catch(e) {
          st.innerText = "接続エラー: " + e.message;
        }
      } else {
        bleDevice.gatt.disconnect();
        bleDevice = null;
        btn.innerText = "Bluetooth 接続";
        btn.className = "btn btn-green";
        st.innerText = "未接続（単体動作中）";
      }
    }
  </script>
</body>
</html>
