<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satellite Controller</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }
    h1 {
      color: #00ff66;
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background-color: #00e676; color: #000; }
    .btn-red { background-color: #ff5252; color: #fff; }
    .status { text-align: center; font-size: 0.85rem; color: #aaa; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .label { font-size: 0.75rem; color: #888; }
    .val { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .val-highlight { color: #00ff66; }
    select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1fr solid #444;
      border-radius: 8px;
      font-size: 1rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #333; }
    th { color: #888; font-weight: normal; }
    .time-display { text-align: center; font-family: monospace; font-size: 1.1rem; color: #00e676; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
</head>
<body>

  <h1>🛰️ Satellite Controller</h1>

  <!-- Bluetooth接続 -->
  <div class="card">
    <button id="btnConnect" class="btn btn-green" onclick="toggleConnect()">Bluetooth 接続</button>
    <div id="statusText" class="status">未接続</div>
  </div>

  <!-- 現在時刻 -->
  <div class="card">
    <div class="label">現在時刻 (Clock)</div>
    <div id="clockDisplay" class="time-display">--:--:-- JST (--:--:-- UTC)</div>
  </div>

  <!-- 衛星選択 -->
  <div class="card">
    <div class="label">対象衛星</div>
    <select id="satSelect" onchange="onSatChange()">
      <option value="45930">RS-44 (DOSAAN)</option>
      <option value="20580">FO-29 (JAS-2)</option>
      <option value="43803">JO-97 (JY1SAT)</option>
      <option value="24278">AO-7</option>
      <option value="39444">AO-73 (Funcube-1)</option>
    </select>
  </div>

  <!-- 自局位置 -->
  <div class="card">
    <div class="grid">
      <div>
        <div class="label">Grid Locator (GL)</div>
        <div id="glDisplay" class="val val-highlight">計算中...</div>
      </div>
      <div>
        <div class="label">自局座標</div>
        <div id="latLonDisplay" class="val" style="font-size:0.9rem;">--.---, --.---</div>
      </div>
    </div>
  </div>

  <!-- リアルタイム方位・仰角 -->
  <div class="card">
    <div class="grid">
      <div>
        <div class="label">方位角 (AZ)</div>
        <div id="azDisplay" class="val">---.-°</div>
      </div>
      <div>
        <div class="label">仰角 (EL)</div>
        <div id="elDisplay" class="val">---.-°</div>
      </div>
    </div>
  </div>

  <!-- 周波数 & パス予測 -->
  <div class="card">
    <div class="label">直近のパス (Next Pass)</div>
    <div id="nextPassInfo" class="val" style="font-size: 0.95rem; margin-top: 4px; color: #ffca28;">
      予報計算中...
    </div>
  </div>

  <!-- 24時間通過予報リスト -->
  <div class="card">
    <div class="label">以降の通過予報 (Upcoming Passes - 24h)</div>
    <table id="passTable">
      <thead>
        <tr>
          <th>AOS (JST)</th>
          <th>LOS (JST)</th>
          <th>Max EL</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" style="text-align:center; color:#666;">計算中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let myLat = 35.539, myLon = 139.793, myAlt = 0.01; // デフォルト(PM95vm近辺)
    let bleDevice, gattServer, txCharacteristic;
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // 簡易TLEデータ（動的に取得も可能）
    const TLE_DB = {
      "45930": { name: "RS-44", line1: "1 45930U 20068F   26086.50000000  .00000100  00000-0  20000-4 0  9991", line2: "2 45930  82.4900 120.1500 0215000 230.1000 125.2000 12.78000000100001" },
      "20580": { name: "FO-29", line1: "1 20580U 90079C   26086.50000000  .00000100  00000-0  30000-4 0  9992", line2: "2 20580  98.5400 140.2200 0035000 180.5000 179.6000 13.52000000100001" }
    };

    // GPS取得
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        myLat = pos.coords.latitude;
        myLon = pos.coords.longitude;
        document.getElementById('latLonDisplay').innerText = `${myLat.toFixed(3)}, ${myLon.toFixed(3)}`;
        document.getElementById('glDisplay').innerText = getGridLocator(myLat, myLon);
        calculatePasses();
      });
    }

    // 時計の更新
    setInterval(() => {
      const now = new Date();
      const jst = now.toLocaleTimeString('ja-JP', { hour12: false });
      const utc = now.toISOString().substr(11, 8);
      document.getElementById('clockDisplay').innerText = `${jst} JST (${utc} UTC)`;
      updateSatPosition();
    }, 1000);

    function getGridLocator(lat, lon) {
      let l1 = String.fromCharCode(65 + Math.floor((lon + 180) / 20));
      let l2 = String.fromCharCode(65 + Math.floor((lat + 90) / 10));
      let n1 = Math.floor(((lon + 180) % 20) / 2);
      let n2 = Math.floor(((lat + 90) % 10));
      let l3 = String.fromCharCode(97 + Math.floor((((lon + 180) % 20) % 2) * 12));
      let l4 = String.fromCharCode(97 + Math.floor((((lat + 90) % 10) % 1) * 24));
      return `${l1}${l2}${n1}${n2}${l3}${l4}`;
    }

    function updateSatPosition() {
      // リアルタイムの位置計算とBLE送信
      const satId = document.getElementById('satSelect').value;
      // ダミーAZ/EL更新（本物のTLE計算ロジック連携）
      const now = new Date();
      const az = ((now.getSeconds() * 6) % 360).toFixed(1);
      const el = (Math.sin(now.getSeconds() / 10) * 40).toFixed(1);

      document.getElementById('azDisplay').innerText = `${az}°`;
      document.getElementById('elDisplay').innerText = `${el}°`;

      if (txCharacteristic) {
        const msg = `AZ:${az},EL:${el}\n`;
        txCharacteristic.writeValue(new TextEncoder().encode(msg)).catch(()=>{});
      }
    }

    function calculatePasses() {
      // 通過予報計算（サンプルデータ表示）
      const tbody = document.querySelector('#passTable tbody');
      tbody.innerHTML = `
        <tr><td>14:15</td><td>14:28</td><td><b style="color:#00ff66;">48°</b></td></tr>
        <tr><td>16:02</td><td>16:14</td><td>18°</td></tr>
        <tr><td>17:48</td><td>18:01</td><td><b>65°</b></td></tr>
        <tr><td>19:35</td><td>19:46</td><td>12°</td></tr>
      `;
      document.getElementById('nextPassInfo').innerText = "AOS: 14:15 JST (あと 41分) / Max EL: 48°";
    }

    async function toggleConnect() {
      const btn = document.getElementById('btnConnect');
      const st = document.getElementById('statusText');
      if (!bleDevice) {
        try {
          bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          });
          gattServer = await bleDevice.gatt.connect();
          const service = await gattServer.getPrimaryService(SERVICE_UUID);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          btn.innerText = "切断する";
          btn.className = "btn btn-red";
          st.innerText = "ESP32 接続済み";
        } catch(e) {
          st.innerText = "接続エラー: " + e.message;
        }
      } else {
        bleDevice.gatt.disconnect();
        bleDevice = null;
        btn.innerText = "Bluetooth 接続";
        btn.className = "btn btn-green";
        st.innerText = "未接続";
      }
    }

    function onSatChange() {
      calculatePasses();
    }
  </script>
</body>
</html>
