<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR2GKZ Satellite Controller & Doppler Tracker</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 14px;
    }
    h1 {
      color: #00ff66;
      text-align: center;
      font-size: 1.3rem;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background-color: #00e676; color: #000; }
    .btn-red { background-color: #ff5252; color: #fff; }
    .status { text-align: center; font-size: 0.8rem; color: #aaa; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .label { font-size: 0.75rem; color: #888; }
    .val { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .val-highlight { color: #00ff66; }
    select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1rem;
    }
    .time-display { text-align: center; font-family: monospace; font-size: 1.1rem; color: #00e676; }
    
    /* コンパス */
    .compass-container { display: flex; justify-content: center; align-items: center; margin: 10px 0; }
    .compass {
      width: 140px; height: 140px; border: 2px solid #00ff66; border-radius: 50%;
      position: relative; background: radial-gradient(circle, #1a2a1a 0%, #0d150d 100%);
    }
    .compass-dir { position: absolute; font-weight: bold; font-size: 0.75rem; color: #aaa; }
    .compass-n { top: 4px; left: 50%; transform: translateX(-50%); color: #ff5252; }
    .compass-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 6px; top: 50%; transform: translateY(-50%); }
    .compass-w { left: 6px; top: 50%; transform: translateY(-50%); }
    .compass-pointer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: transform 0.3s ease-out; }
    .compass-pointer::after { content: '🛰️'; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-size: 1rem; }
    .compass-center { width: 6px; height: 6px; background: #00ff66; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    
    .freq-box { background: #252525; padding: 8px; border-radius: 6px; margin-top: 6px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
</head>
<body>

  <h1>🛰️ JR2GKZ Satellite & Doppler</h1>

  <!-- Bluetooth接続 -->
  <div class="card">
    <button id="btnConnect" class="btn btn-green" onclick="toggleConnect()">Bluetooth 接続 (ESP32)</button>
    <div id="statusText" class="status">未接続</div>
  </div>

  <!-- 現在時刻 -->
  <div class="card">
    <div class="label">UTC / JST Clock</div>
    <div id="clockDisplay" class="time-display">--:--:--</div>
  </div>

  <!-- 衛星選択 -->
  <div class="card">
    <div class="label">対象衛星</div>
    <select id="satSelect" onchange="onSatChange()">
      <option value="44909">RS-44 (DOSAAN)</option>
      <option value="20580">FO-29 (JAS-2)</option>
      <option value="43803">JO-97 (JY1SAT)</option>
      <option value="39444">AO-73 (Funcube-1)</option>
      <option value="25544">ISS (国際宇宙ステーション)</option>
    </select>
  </div>

  <!-- コンパス & AZ/EL -->
  <div class="card">
    <div class="label" style="text-align: center;">アンテナ方位 (Rotator)</div>
    <div class="compass-container">
      <div class="compass">
        <div class="compass-dir compass-n">N</div>
        <div class="compass-dir compass-e">E</div>
        <div class="compass-dir compass-s">S</div>
        <div class="compass-dir compass-w">W</div>
        <div class="compass-center"></div>
        <div id="compassPointer" class="compass-pointer"></div>
      </div>
    </div>
    <div class="grid">
      <div style="text-align: center;">
        <div class="label">方位角 (AZ)</div>
        <div id="azDisplay" class="val">---.-°</div>
      </div>
      <div style="text-align: center;">
        <div class="label">仰角 (EL)</div>
        <div id="elDisplay" class="val">---.-°</div>
      </div>
    </div>
  </div>

  <!-- ドップラー補正周波数表示 -->
  <div class="card">
    <div class="label">ドップラー補正周波数 (Doppler Track)</div>
    <div class="freq-box">
      <div class="label">アップリンク (TX / IC-9700/FT-818)</div>
      <div id="txFreqDisplay" class="val val-highlight">-------- Hz</div>
    </div>
    <div class="freq-box" style="margin-top: 8px;">
      <div class="label">ダウンリンク (RX / IC-9700)</div>
      <div id="rxFreqDisplay" class="val" style="color: #00bcd4;">-------- Hz</div>
    </div>
  </div>

  <!-- 自局位置・ロケータ -->
  <div class="card">
    <div class="grid">
      <div>
        <div class="label">Grid Locator</div>
        <div id="glDisplay" class="val val-highlight">PM95vn</div>
      </div>
      <div>
        <div class="label">位置</div>
        <div class="val" style="font-size:0.85rem;">Ota-ku, Tokyo</div>
      </div>
    </div>
  </div>

  <script>
    // 自局位置 (東京都大田区)
    const myLat = 35.6, myLon = 139.7, myAlt = 0.05;
    let bleDevice, gattServer, txCharacteristic;
    
    // BLE UUID (ESP32側の設定に合わせる)
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // 衛星データ & 基準周波数 (Hz) 【リニア・FM対応】
    const SATELLITES = {
      "44909": {
        name: "RS-44",
        l1: "1 44909U 19096E   26270.31247685  .00000118  00000-0  17920-4 0  9993",
        l2: "2 44909  82.4784 284.8152 0215940 182.7520 177.1040 12.79813200271512",
        upBase: 145965000, // 145.965 MHz (CW/SSB)
        dnBase: 435640000, // 435.640 MHz
        inverting: true
      },
      "20580": {
        name: "FO-29",
        l1: "1 20580U 96046B   26270.50000000  .00000100  00000-0  30000-4 0  9992",
        l2: "2 20580  98.5400 140.2200 0035000 180.5000 179.6000 13.52000000100001",
        upBase: 145900000,
        dnBase: 435800000,
        inverting: true
      },
      "43803": {
        name: "JO-97",
        l1: "1 43803U 18099AX  26270.50000000  .00000100  00000-0  25000-4 0  9993",
        l2: "2 43803  97.5000 150.1000 0012000 110.2000 250.1000 15.12000000100001",
        upBase: 145920000,
        dnBase: 435350000,
        inverting: true
      },
      "39444": {
        name: "AO-73",
        l1: "1 39444U 13066AE  26270.50000000  .00000100  00000-0  18000-4 0  9994",
        l2: "2 39444  97.7000 160.3000 0008000  90.5000 270.2000 14.82000000100001",
        upBase: 145935000,
        dnBase: 145975000,
        inverting: false
      },
      "25544": {
        name: "ISS",
        l1: "1 25544U 98067A   26270.50000000  .00010000  00000-0  18000-3 0  9996",
        l2: "2 25544  51.6400 200.5000 0005000 120.1000 240.2000 15.49000000100001",
        upBase: 145800000, // FM Voice
        dnBase: 145800000,
        inverting: false
      }
    };

    let currentSatRec = null;
    let currentSatConfig = null;
    const LIGHT_SPEED = 299792458; // m/s

    onSatChange();

    // 毎秒実行するメインループ
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = 
        now.toISOString().substr(11, 8) + " UTC / " + now.toLocaleTimeString('ja-JP', {hour12:false});
      
      updateSatelliteTracking(now);
    }, 1000);

    function onSatChange() {
      const satId = document.getElementById('satSelect').value;
      currentSatConfig = SATELLITES[satId];
      if (currentSatConfig) {
        currentSatRec = satellite.twoline2satrec(currentSatConfig.l1, currentSatConfig.l2);
      }
    }

    function updateSatelliteTracking(now) {
      if (!currentSatRec || !currentSatConfig) return;

      const pv = satellite.propagate(currentSatRec, now);
      if (!pv.position || !pv.velocity) return;

      const gmst = satellite.gstime(now);
      const observerGd = {
        longitude: satellite.degreesToRadians(myLon),
        latitude: satellite.degreesToRadians(myLat),
        height: myAlt
      };

      const posEcf = satellite.eciToEcf(positionAndVelocityCheck(pv.position), gmst); // 簡易処理
      // 正式なLookAngles計算
      const look = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(pv.position, gmst));
      
      const az = satellite.radiansToDegrees(look.azimuth);
      const el = satellite.radiansToDegrees(look.elevation);

      // 方位・仰角の画面反映
      document.getElementById('azDisplay').innerText = `${az.toFixed(1)}°`;
      document.getElementById('elDisplay').innerText = `${el.toFixed(1)}°`;

      const pointer = document.getElementById('compassPointer');
      if (pointer) pointer.style.transform = `rotate(${az}deg)`;

      // ドップラーシフト計算 (rangeRate [km/s] から算出)
      // look.rangeRate は視線方向の速度 (km/s)
      const rangeRate = look.rangeRate * 1000; // m/s
      const dopplerFactor = rangeRate / LIGHT_SPEED;

      // ダウンリンク周波数計算
      const rxFreq = Math.round(currentSatConfig.dnBase * (1 - dopplerFactor));
      
      // アップリンク周波数計算 (トランスポンダが反転式/Invertingの場合は符号を反転)
      let txFreq;
      if (currentSatConfig.inverting) {
        txFreq = Math.round(currentSatConfig.upBase * (1 + dopplerFactor));
      } else {
        txFreq = Math.round(currentSatConfig.upBase * (1 - dopplerFactor));
      }

      // 周波数画面反映
      document.getElementById('txFreqDisplay').innerText = (txFreq / 1000000).toFixed(4) + " MHz";
      document.getElementById('rxFreqDisplay').innerText = (rxFreq / 1000000).toFixed(4) + " MHz";

      // Bluetooth接続中の場合、ESP32へデータ送信（スロットリング：毎秒）
      if (txCharacteristic) {
        const payload = `SET,AZ:${az.toFixed(1)},EL:${el.toFixed(1)},TX:${txFreq},RX:${rxFreq}\n`;
        txCharacteristic.writeValue(new TextEncoder().encode(payload)).catch(err => {
          console.log("BLE Write Error:", err);
        });
      }
    }

    function positionAndVelocityCheck(pos) {
      return pos; // プレースホルダー
    }

    // Bluetooth 接続制御
    async function toggleConnect() {
      const btn = document.getElementById('btnConnect');
      const st = document.getElementById('statusText');
      if (!bleDevice) {
        try {
          bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          });
          gattServer = await bleDevice.gatt.connect();
          const service = await gattServer.getPrimaryService(SERVICE_UUID);
          txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          
          btn.innerText = "切断する";
          btn.className = "btn btn-red";
          st.innerText = "ESP32 接続成功";
        } catch(e) {
          st.innerText = "接続エラー: " + e.message;
        }
      } else {
        if (bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
        bleDevice = null;
        txCharacteristic = null;
        btn.innerText = "Bluetooth 接続 (ESP32)";
        btn.className = "btn btn-green";
        st.innerText = "未接続";
      }
    }
  </script>
</body>
</html>
